<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspace home — Kaiju</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
  body{margin:0;font-family:"Manrope",system-ui,sans-serif;background:#FAFBFE;color:#1B1D27;-webkit-font-smoothing:antialiased}
  a{color:#4C63F5;text-decoration:none}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #FAFBFE; display: flex; font-size: 14px;">

  <dc-import name="Sidebar" active="members" hint-size="232px,900px"></dc-import>

  <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0;">

    <dc-import name="TopBar" crumb="Acme Inc" search-placeholder="Search members, settings…" sync-state="offline" pending-count="3" hint-size="100%,56px"></dc-import>

    <div style="flex-grow: 1; overflow: auto; padding: 32px 40px; display: flex; flex-direction: column; gap: 24px; box-sizing: border-box;">
      <div>
        <h1 style="margin: 0 0 4px; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700;">Welcome back, Alex</h1>
        <p style="margin: 0; font-size: 13px; color: #767B8C;">Here's what's going on in Acme Inc.</p>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;">
        <div style="background: #FFFFFF; border: 1px solid #ECEEF6; border-radius: 12px; padding: 20px;">
          <span style="font-size: 12px; color: #767B8C; font-weight: 600;">Members</span>
          <div style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; margin-top: 4px;">12</div>
        </div>
        <div style="background: #FFFFFF; border: 1px solid #ECEEF6; border-radius: 12px; padding: 20px;">
          <span style="font-size: 12px; color: #767B8C; font-weight: 600;">Pending invites</span>
          <div style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; margin-top: 4px; color: #8B6FFF;">3</div>
        </div>
        <div style="background: #FFFFFF; border: 1px solid #ECEEF6; border-radius: 12px; padding: 20px;">
          <span style="font-size: 12px; color: #767B8C; font-weight: 600;">Your role</span>
          <div style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; margin-top: 4px;">Owner</div>
        </div>
      </div>

      <div>
        <div style="display: flex; align-items: center; margin-bottom: 12px;">
          <span style="font-size: 13px; font-weight: 700;">Your projects</span>
          <div style="flex-grow: 1;"></div>
          <a href="#" style="font-size: 12px; font-weight: 700;">View all →</a>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;">
          <sc-for list="{{projects}}" as="p" hint-placeholder-count="3">
            <div style="background: #FFFFFF; border: 1px solid #ECEEF6; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
              <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 34px; height: 34px; border-radius: 9px; background: {{p.bg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                  <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: {{p.fg}};">{{p.key}}</span>
                </div>
                <div style="min-width: 0;">
                  <div style="font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.name}}</div>
                  <div style="font-size: 11px; color: #A7ABBB;">{{p.openIssues}} open issues</div>
                </div>
              </div>
            </div>
          </sc-for>
          <div onClick="{{goCreate}}" style="background: #FFFFFF; border: 1px dashed #DEE1EC; border-radius: 12px; padding: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4C63F5" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span style="font-size: 12px; font-weight: 700; color: #4C63F5;">New project</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      ['KJ', 'Kaiju', '#EDF0FE', '#4C63F5', 42],
      ['PAY', 'Payments Platform', '#FFEEE9', '#FF6A45', 18],
      ['MKT', 'Marketing Site', '#F1EDFF', '#8B6FFF', 7],
    ];
    return {
      projects: rows.map(([key, name, bg, fg, openIssues]) => ({ key, name, bg, fg, openIssues })),
      goCreate: () => {},
    };
  }
}
</script>
</body>
</html>
