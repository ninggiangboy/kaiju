<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=Manrope:wght@600;700&amp;family=JetBrains+Mono:wght@600&amp;display=swap">
<style>
  body{margin:0;font-family:"Manrope",system-ui,sans-serif;color:#1B1D27;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .navitem{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;color:#767B8C;cursor:pointer;}
  .navitem.active{background:#EDF0FE;color:#4C63F5;}
  .navitem.disabled{color:#C3C6D4;cursor:default;}
</style>
</helmet>
<div style="width: 232px; height: 960px; box-sizing: border-box; background: #FFFFFF; border-right: 1px solid #ECEEF6; display: flex; flex-direction: column; padding: 16px 12px; gap: 14px;">

  <a href="#" style="display: flex; align-items: center; gap: 6px; padding: 4px; font-size: 12px; font-weight: 700; color: #A7ABBB;">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#A7ABBB" stroke-width="2.4"><path d="M15 18l-6-6 6-6"></path></svg>
    Acme Inc
  </a>

  <div style="display: flex; align-items: center; gap: 8px; padding: 4px 8px;">
    <div style="width: 26px; height: 26px; border-radius: 7px; background: {{projectBg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 10px; color: {{projectFg}};">{{projectKey}}</span>
    </div>
    <span style="font-weight: 700; font-size: 13px; flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{projectName}}</span>
  </div>

  <div style="height: 1px; background: #F0F1F7;"></div>

  <div style="display: flex; flex-direction: column; gap: 2px;">
    <div class="navitem {{cls.summary}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
      Summary
    </div>
    <div class="navitem {{cls.issues}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
      Issues
    </div>
    <a href="Board.dc.html" class="navitem {{cls.board}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
      Board
    </a>
    <a href="SprintBacklog.dc.html" class="navitem {{cls.backlog}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="4" rx="1"></rect><rect x="3" y="10" width="18" height="4" rx="1"></rect><rect x="3" y="16" width="10" height="4" rx="1"></rect></svg>
      Sprint backlog
    </a>
    <a href="Roadmap.dc.html" class="navitem {{cls.roadmap}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="8" x2="10" y2="8"></line><line x1="14" y1="8" x2="21" y2="8"></line><circle cx="12" cy="8" r="2"></circle><line x1="3" y1="16" x2="7" y2="16"></line><line x1="11" y1="16" x2="21" y2="16"></line><circle cx="9" cy="16" r="2"></circle></svg>
      Roadmap
    </a>
    <a href="Versions.dc.html" class="navitem {{cls.releases}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41L11 3.83A2 2 0 009.59 3.24H4a1 1 0 00-1 1v5.59a2 2 0 00.59 1.41l9.58 9.59a2 2 0 002.83 0l4.59-4.59a2 2 0 000-2.83z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
      Releases
    </a>
    <a href="Dashboards.dc.html" class="navitem {{cls.dashboards}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
      Dashboards
    </a>
    <a href="Automations.dc.html" class="navitem {{cls.automation}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"></path></svg>
      Automation
    </a>
    <div class="navitem {{cls.members}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"></circle><path d="M17 21v-2a4 4 0 00-3-3.87"></path><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"></path><path d="M14 3.13a4 4 0 010 7.75"></path></svg>
      Members
    </div>
    <div class="navitem {{cls.components}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v4"></path><path d="M12 18v4"></path><path d="M4.93 4.93l2.83 2.83"></path><path d="M16.24 16.24l2.83 2.83"></path><path d="M2 12h4"></path><path d="M18 12h4"></path><path d="M4.93 19.07l2.83-2.83"></path><path d="M16.24 7.76l2.83-2.83"></path></svg>
      Components
    </div>
    <div class="navitem {{cls.settings}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09A1.65 1.65 0 0015.4 4.6a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>
      Settings
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px;">
    <div style="width: 26px; height: 26px; border-radius: 999px; background: #EDF0FE; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #4C63F5;">AL</div>
    <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0;">
      <span style="font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Alex Lam</span>
      <span style="font-size: 10px; color: #A7ABBB;">Owner</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"summary","options":["summary","issues","board","backlog","roadmap","releases","dashboards","automation","members","components","settings"]},"projectKey":{"editor":"text","default":"PAY"},"projectName":{"editor":"text","default":"Payments Platform"},"projectBg":{"editor":"color","default":"#FFEEE9"},"projectFg":{"editor":"color","default":"#FF6A45"},"$preview":{"width":232,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'summary';
    const cls = { summary: '', issues: '', board: '', backlog: '', roadmap: '', releases: '', dashboards: '', automation: '', members: '', components: '', settings: '' };
    cls[active] = 'active';
    return {
      cls,
      projectKey: this.props.projectKey ?? 'PAY',
      projectName: this.props.projectName ?? 'Payments Platform',
      projectBg: this.props.projectBg ?? '#FFEEE9',
      projectFg: this.props.projectFg ?? '#FF6A45',
    };
  }
}
</script>
</body>
</html>
