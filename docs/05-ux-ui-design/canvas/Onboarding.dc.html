<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding — Kaiju</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=Manrope:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
  body{margin:0;font-family:"Manrope",system-ui,sans-serif;background:#FAFBFE;color:#1B1D27;-webkit-font-smoothing:antialiased}
  a{color:#4C63F5;text-decoration:none}
  input::placeholder{color:#A7ABBB}
  input:focus{outline:none;border-color:#4C63F5!important;box-shadow:0 0 0 3px #EDF0FE}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #FFFFFF; display: flex;">

  <dc-import name="AuthPanel" hint-size="360px,900px"></dc-import>

  <div style="flex-grow: 1; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 40px 48px; box-sizing: border-box;">
    <div style="width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 16px;">

      <sc-if value="{{hasPendingInvite}}" hint-placeholder-val="{{false}}">
        <div style="background: #F1EDFF; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 10px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B6FFF" stroke-width="2" style="flex-shrink:0;"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
          <span style="font-size: 12px; color: #5B3FC9; flex-grow: 1;">You have a pending invite to <strong>Acme Inc</strong>.</span>
          <a href="InviteAccept.dc.html" style="font-size: 12px; font-weight: 700; white-space: nowrap;">View invite →</a>
        </div>
      </sc-if>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 11px; font-weight: 700; color: #4C63F5; letter-spacing: 0.04em; text-transform: uppercase;">Welcome</span>
        <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; line-height: 28px; font-weight: 700;">Let's set up your workspace</h1>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 8px;">
        <label style="font-size: 12px; font-weight: 600;">Your display name</label>
        <input value="Alex" style="height: 36px; box-sizing: border-box; padding: 0 10px; font-size: 13px; font-family: inherit; color: #1B1D27; background: #FAFBFE; border: 1px solid #DEE1EC; border-radius: 8px;">
        <span style="font-size: 11px; color: #A7ABBB;">Filled in from your email — change it any time.</span>
      </div>

      <div style="height: 1px; background: #F0F1F7;"></div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 12px; font-weight: 600;">Workspace name</label>
        <input value="Acme Inc" style="height: 36px; box-sizing: border-box; padding: 0 10px; font-size: 13px; font-family: inherit; color: #1B1D27; background: #FAFBFE; border: 1px solid #DEE1EC; border-radius: 8px;">
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 12px; font-weight: 600;">Workspace URL</label>
        <div style="height: 36px; box-sizing: border-box; padding: 0 10px; display: flex; align-items: center; gap: 2px; background: #FAFBFE; border: 1px solid #DEE1EC; border-radius: 8px;">
          <span style="font-size: 13px; color: #A7ABBB; font-family: 'JetBrains Mono', monospace;">kaiju.app/w/</span>
          <input value="acme-inc" style="border: none; background: transparent; outline: none; font-size: 13px; font-family: 'JetBrains Mono', monospace; color: #1B1D27; flex-grow: 1; padding: 0;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#767B8C" stroke-width="2" style="flex-shrink:0;"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        </div>
        <span style="font-size: 11px; color: #22B573; display: flex; align-items: center; gap: 4px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#22B573" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><path d="M9 12l2 2 4-4"></path></svg>
          Available
        </span>
      </div>

      <a href="AppShell.dc.html" style="height: 36px; border-radius: 8px; background: #4C63F5; color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 4px;">
        Create workspace
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"hasPendingInvite":{"editor":"boolean","default":false,"section":"Variant"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { hasPendingInvite: !!this.props.hasPendingInvite };
  }
}
</script>
</body>
</html>
