# Tier 3 - staging, everything on ONE host.
#
# Only the application runs in containers. Anything with state does NOT:
#
#   PostgreSQL       installed on the host, or a managed service
#   Redis server     installed on the host
#   Mail             a real transactional mail service
#   Object storage   a real S3-compatible service
#   Observability    a real collection endpoint
#
# NO stand-in services remain (CON-73). That is the line that defines tier 3:
# the three things below only break on first contact with a real service, and
# without tier 3 that first contact happens in production.
#
#   1. sender domain authentication -> "signing in does not work"
#   2. object storage policy        -> signed links, cross-origin config
#   3. certificate chain and domain -> sync stream over real TLS
#
#   docker compose --env-file /etc/kaiju/staging.env \
#                  -f infra/staging/docker-compose.yml up -d

name: kaiju-staging

x-app: &app
  image: ${KAIJU_IMAGE:?KAIJU_IMAGE must be an immutable tag bound to a commit, never a moving tag}
  env_file:
    - ${KAIJU_ENV_FILE:-/etc/kaiju/staging.env}
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  # Runs before every role, then exits. Nothing migrates at application
  # startup, at any tier (CON-68), so this is the only thing that touches the
  # schema - and the deployment order (CON-69) gets exercised here, where it
  # can still fail harmlessly.
  #
  # It connects DIRECTLY, not through a pooler: the changelog lock is held for
  # the length of the run and a session-scoped lock does not survive
  # transaction pooling (CON-62).
  migrate:
    <<: *app
    environment:
      KAIJU_ROLE: migrate
      KAIJU_DB_POOL_SIZE: "2"
      KAIJU_MIGRATE_COMMAND: up
      KAIJU_DB_URL: ${KAIJU_DB_DIRECT_URL:?KAIJU_DB_DIRECT_URL must be set - the migration runner never goes through a pooler}
    restart: "no"

  worker:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      KAIJU_ROLE: worker
      KAIJU_DB_POOL_SIZE: "10"
      OTEL_SERVICE_NAME: kaiju-worker

  scheduler:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      KAIJU_ROLE: scheduler
      KAIJU_DB_POOL_SIZE: "3"
      OTEL_SERVICE_NAME: kaiju-scheduler

  # api and realtime come up AFTER worker and scheduler: background processes
  # must understand the new event format before anything produces it (CON-69).
  api:
    <<: *app
    depends_on:
      worker:
        condition: service_started
      scheduler:
        condition: service_started
    environment:
      KAIJU_ROLE: api
      KAIJU_DB_POOL_SIZE: "20"
      OTEL_SERVICE_NAME: kaiju-api
    expose:
      - "8080"

  realtime:
    <<: *app
    depends_on:
      worker:
        condition: service_started
    environment:
      KAIJU_ROLE: realtime
      KAIJU_DB_POOL_SIZE: "5"
      OTEL_SERVICE_NAME: kaiju-realtime
    # Longer than the heartbeat interval, so clients reconnect deliberately.
    stop_grace_period: 45s
    expose:
      - "8080"

  frontend:
    image: ${KAIJU_FRONTEND_IMAGE:?immutable tag bound to a commit}
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    depends_on:
      - api
      - realtime
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      KAIJU_DOMAIN: ${KAIJU_DOMAIN:?a real domain, required for the certificate}
    volumes:
      - ../proxy/Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
