apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kaiju
resources:
  - ../../base

patches:
  - path: ingress-host.yaml
    target: { kind: Ingress }

# Bí mật KHÔNG nằm trong repository. `kaiju-secrets` được tạo bởi cơ chế bí mật
# của nền tảng (bộ điều khiển bí mật ngoài, hoặc `kubectl create secret` trong
# bước triển khai có duyệt thủ công). Các khoá bắt buộc:
#
#   KAIJU_DB_URL              KAIJU_MAIL_HOST
#   KAIJU_DB_LISTEN_URL       KAIJU_MAIL_PORT
#   KAIJU_DB_USER             KAIJU_MAIL_USER
#   KAIJU_DB_PASSWORD         KAIJU_MAIL_PASSWORD
#   KAIJU_REDIS_URL           KAIJU_MAIL_FROM
#   KAIJU_PUBLIC_URL          KAIJU_OBJECT_STORAGE_ENDPOINT
#   KAIJU_TOKEN_SIGNING_KEY   KAIJU_OBJECT_STORAGE_BUCKET
#   OTEL_EXPORTER_OTLP_ENDPOINT
#   KAIJU_OBJECT_STORAGE_ACCESS_KEY / _SECRET_KEY
#
# CON-25: KAIJU_DB_LISTEN_URL phải trỏ THẲNG tới cơ sở dữ liệu. Nếu về sau có
# bộ gộp kết nối ở bậc này, KAIJU_DB_URL đổi còn biến trên thì không.
