apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kaiju
resources:
  - ../../base

patches:
  - path: ingress-host.yaml
    target: { kind: Ingress }

# Secrets do NOT live in the repository. `kaiju-secrets` is created by the
# platform's secret mechanism (an external secrets controller, or a
# `kubectl create secret` inside the manually approved deploy step). Required
# keys:
#
#   KAIJU_DB_URL              KAIJU_MAIL_HOST
#   KAIJU_DB_DIRECT_URL       KAIJU_MAIL_PORT
#   KAIJU_DB_USER             KAIJU_MAIL_USER
#   KAIJU_DB_PASSWORD         KAIJU_MAIL_PASSWORD
#   KAIJU_REDIS_URL           KAIJU_MAIL_FROM
#   KAIJU_PUBLIC_URL          KAIJU_OBJECT_STORAGE_ENDPOINT
#   KAIJU_TOKEN_SIGNING_KEY   KAIJU_OBJECT_STORAGE_BUCKET
#   OTEL_EXPORTER_OTLP_ENDPOINT
#   KAIJU_OBJECT_STORAGE_ACCESS_KEY / _SECRET_KEY
#
# CON-25: KAIJU_DB_DIRECT_URL must point DIRECTLY at the database. If a
# connection pooler is ever added at this tier, KAIJU_DB_URL changes and this
# one does not.
