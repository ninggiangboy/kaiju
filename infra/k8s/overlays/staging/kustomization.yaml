apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kaiju-staging
resources:
  - ../../base

patches:
  - path: ingress-host.yaml
    target: { kind: Ingress }

# Secrets do NOT live in the repository - see the production overlay for the
# list of required keys in `kaiju-secrets`.
#
# Tier 3 normally runs through compose on a single VPS (see infra/staging/).
# This overlay is only for standing staging up on the same cluster as
# production, which is useful for exercising the manifests themselves rather
# than the application.
replicas:
  - { name: kaiju-api, count: 1 }
  - { name: kaiju-realtime, count: 1 }
  - { name: kaiju-worker, count: 1 }
  - { name: kaiju-scheduler, count: 1 }
  - { name: kaiju-frontend, count: 1 }

# THE DEPLOYED VERSION OF THIS ENVIRONMENT.
#
# Under GitOps this block is the record of what is running (CON-77). Deploying
# is a pull request that changes these two lines and nothing else; rolling back
# is `git revert` of that commit. Argo CD reconciles from here - no pipeline
# ever issues an imperative command against the cluster.
#
# Tags are immutable and bound to a commit (CON-70): `sha-<short>`, or `v<x.y.z>`
# on a released tag. Never `latest`, `main` or any other moving tag.
# The pipeline rewrites these with:
#   kustomize edit set image kaiju-backend=<registry>/backend:<tag>
# so name and tag always move together and can never drift apart.
images:
  - name: kaiju-backend
    newName: ghcr.io/OWNER/kaiju/backend
    newTag: REPLACED_BY_OVERLAY
  - name: kaiju-frontend
    newName: ghcr.io/OWNER/kaiju/frontend
    newTag: REPLACED_BY_OVERLAY
