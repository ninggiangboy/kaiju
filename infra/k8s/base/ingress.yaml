# The sync stream only works when the ingress layer is configured correctly.
# These three annotations are the entire reason this Ingress is separate from
# the ordinary one:
#
#   proxy-buffering: off    missing -> deltas held back, NO error anywhere
#   proxy-read-timeout      must exceed the heartbeat interval
#   X-Accel-Buffering: no   disables buffering at the outermost layer
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kaiju-sync
  namespace: kaiju
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Accel-Buffering no;
spec:
  ingressClassName: nginx
  rules:
    - host: REPLACED_BY_OVERLAY
      http:
        paths:
          - path: /api/sync/stream
            pathType: Prefix
            backend:
              service:
                name: kaiju-realtime
                port: { name: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kaiju
  namespace: kaiju
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: REPLACED_BY_OVERLAY
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: kaiju-api
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kaiju-frontend
                port: { name: http }
