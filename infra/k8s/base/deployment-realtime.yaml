apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaiju-realtime
  namespace: kaiju
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: kaiju-realtime }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kaiju-realtime }
    spec:
      # Vai trò này giữ kết nối dài hạn. Thời gian tắt êm phải DÀI HƠN chu kỳ
      # nhịp tim, để client kịp nhận tín hiệu đóng và nối lại chủ động thay vì
      # phát hiện ra bằng thời gian chờ.
      terminationGracePeriodSeconds: 90
      containers:
        - name: app
          image: kaiju-backend
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: KAIJU_ROLE
              value: realtime
            - name: KAIJU_DB_POOL_SIZE
              value: "5"
            - name: OTEL_SERVICE_NAME
              value: kaiju-realtime
          envFrom:
            - configMapRef: { name: kaiju-config }
            - secretRef: { name: kaiju-secrets }
          # Khoẻ nghĩa là kết nối được cơ sở dữ liệu và Redis, VÀ đang đăng ký
          # nhận phát tán — không đăng ký được thì client không nhận delta nào.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 1536Mi }
