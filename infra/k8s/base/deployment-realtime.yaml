apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaiju-realtime
  namespace: kaiju
  annotations:
    # Deployment order is mandatory (CON-69): migration -> worker and
    # scheduler -> api and realtime. Argo CD enforces it through waves;
    # the migration runs earlier still, as a PreSync hook.
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: kaiju-realtime }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kaiju-realtime }
    spec:
      # CON-79: without this, both replicas can land on the SAME node. The PDB
      # then refuses every eviction on that node (it must keep one available),
      # which deadlocks `kubectl drain` and stalls any cluster scale-down - while
      # also silently giving up the availability the second replica was for.
      #
      # DoNotSchedule is deliberate: on a one-node cluster the second replica
      # stays Pending, and that Pending pod is exactly the signal the cluster
      # autoscaler needs to add a node.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: kaiju-realtime }
      # This role holds long-lived connections. The shutdown grace period must
      # EXCEED the heartbeat interval, so clients see the close and reconnect
      # deliberately rather than discovering it through a timeout.
      terminationGracePeriodSeconds: 90
      containers:
        - name: app
          image: kaiju-backend
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: KAIJU_ROLE
              value: realtime
            - name: KAIJU_DB_POOL_SIZE
              value: "5"
            - name: OTEL_SERVICE_NAME
              value: kaiju-realtime
          envFrom:
            - configMapRef: { name: kaiju-config }
            - secretRef: { name: kaiju-secrets }
          # Healthy means the database and Redis are reachable AND the
          # broadcast subscription is live - without it no client receives a
          # single delta.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 1536Mi }
