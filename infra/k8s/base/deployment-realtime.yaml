apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaiju-realtime
  namespace: kaiju
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: kaiju-realtime }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kaiju-realtime }
    spec:
      # This role holds long-lived connections. The shutdown grace period must
      # EXCEED the heartbeat interval, so clients see the close and reconnect
      # deliberately rather than discovering it through a timeout.
      terminationGracePeriodSeconds: 90
      containers:
        - name: app
          image: kaiju-backend
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: KAIJU_ROLE
              value: realtime
            - name: KAIJU_DB_POOL_SIZE
              value: "5"
            - name: OTEL_SERVICE_NAME
              value: kaiju-realtime
          envFrom:
            - configMapRef: { name: kaiju-config }
            - secretRef: { name: kaiju-secrets }
          # Healthy means the database and Redis are reachable AND the
          # broadcast subscription is live - without it no client receives a
          # single delta.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 1536Mi }
