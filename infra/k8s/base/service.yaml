apiVersion: v1
kind: Service
metadata:
  name: kaiju-api
  namespace: kaiju
spec:
  selector: { app.kubernetes.io/name: kaiju-api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: kaiju-realtime
  namespace: kaiju
spec:
  selector: { app.kubernetes.io/name: kaiju-realtime }
  ports: [{ name: http, port: 80, targetPort: http }]
  # Session affinity. Not required, but it reduces re-bootstraps: a reconnecting
  # client landing on the same replica finds its sync position still in that
  # replica's memory.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP: { timeoutSeconds: 10800 }
---
apiVersion: v1
kind: Service
metadata:
  name: kaiju-frontend
  namespace: kaiju
spec:
  selector: { app.kubernetes.io/name: kaiju-frontend }
  ports: [{ name: http, port: 80, targetPort: http }]
