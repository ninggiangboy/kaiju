# Tier 4 - production.
#
# The four application roles are four separate Deployments that scale
# independently while SHARING one image (CON-66). The role is selected through
# the KAIJU_ROLE environment variable.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - migrate-job.yaml
  - deployment-api.yaml
  - deployment-realtime.yaml
  - deployment-worker.yaml
  - deployment-scheduler.yaml
  - deployment-frontend.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: kaiju

# Image tags are overridden by the pipeline with the commit hash. NEVER use a
# moving tag (CON-70) - deploying from one means not knowing what is running.
images:
  - name: kaiju-backend
    newTag: REPLACED_BY_PIPELINE
  - name: kaiju-frontend
    newTag: REPLACED_BY_PIPELINE
