# Tier 4 - production.
#
# The four application roles are four separate Deployments that scale
# independently while SHARING one image (CON-66). The role is selected through
# the KAIJU_ROLE environment variable.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - migrate-job.yaml
  - deployment-api.yaml
  - deployment-realtime.yaml
  - deployment-worker.yaml
  - deployment-scheduler.yaml
  - deployment-frontend.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: kaiju

# THE DEPLOYED VERSION OF WHATEVER BRANCH THIS IS.
#
# One environment per branch (CON-77): `dev` carries the newest build, and a
# promotion is a pull request from one environment branch to the next, which
# carries this value with it. The diff of that pull request is exactly the tag
# change - which is what makes merging it a reviewable deployment.
#
# Tags are immutable and bound to a commit (CON-70): `sha-<short>`, or `v<x.y.z>`
# on a released tag. Never `latest`, `dev` or any other moving tag.
images:
  - name: kaiju-backend
    newName: ghcr.io/ninggiangboy/kaiju/backend
    newTag: REPLACED_BY_PIPELINE
  - name: kaiju-frontend
    newName: ghcr.io/ninggiangboy/kaiju/frontend
    newTag: REPLACED_BY_PIPELINE
