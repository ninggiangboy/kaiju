# Each role scales on a DIFFERENT signal - that is why there are four separate
# Deployments in the first place.
#
# UNSETTLED: `realtime` should really scale on OPEN SYNC CONNECTIONS and
# `worker` on EVENT QUEUE LAG, not on CPU. Both need a custom metrics adapter.
# CPU is a placeholder and must be replaced before real load arrives: a realtime
# replica holding ten thousand idle connections uses almost no CPU, so the rule
# below will never fire at the right moment.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kaiju-api
  namespace: kaiju
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: kaiju-api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kaiju-realtime
  namespace: kaiju
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: kaiju-realtime }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    # Scale down slowly: every removed replica drops a batch of clients that
    # then have to catch up.
    scaleDown:
      stabilizationWindowSeconds: 600
      policies: [{ type: Pods, value: 1, periodSeconds: 300 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kaiju-worker
  namespace: kaiju
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: kaiju-worker }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
