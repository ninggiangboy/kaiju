# Mỗi vai trò mở rộng theo một tín hiệu KHÁC nhau — đó là lý do tách bốn đối
# tượng triển khai ngay từ đầu.
#
# > Chưa chốt: `realtime` đúng ra phải mở rộng theo SỐ KẾT NỐI ĐỒNG BỘ ĐANG MỞ
# > và `worker` theo ĐỘ TRỄ HÀNG ĐỢI SỰ KIỆN, chứ không phải theo CPU. Cả hai
# > cần bộ chuyển đổi chỉ số tuỳ biến. Dùng CPU là bản tạm và phải đổi trước
# > khi có tải thật: một realtime giữ mười nghìn kết nối nhàn rỗi gần như không
# > tốn CPU, nên quy tắc dưới đây sẽ không bao giờ kích hoạt đúng lúc.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kaiju-api
  namespace: kaiju
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: kaiju-api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kaiju-realtime
  namespace: kaiju
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: kaiju-realtime }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    # Thu nhỏ chậm: mỗi bản bị gỡ là một loạt client mất kết nối và phải bắt kịp.
    scaleDown:
      stabilizationWindowSeconds: 600
      policies: [{ type: Pods, value: 1, periodSeconds: 300 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kaiju-worker
  namespace: kaiju
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: kaiju-worker }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
