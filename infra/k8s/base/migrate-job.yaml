# CON-68: ở bậc 4, migration chạy như một công việc RIÊNG trước khi triển khai,
# không chạy lúc ứng dụng khởi động. Nhiều bản cùng khởi động sẽ cùng chạy
# migration — đó là lý do khác biệt so với ba bậc dưới.
#
# Tên công việc mang thẻ ảnh, nên mỗi lần phát hành là một công việc mới và
# lịch sử giữ lại được.
apiVersion: batch/v1
kind: Job
metadata:
  name: kaiju-migrate
  namespace: kaiju
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kaiju-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: kaiju-backend
          args: ["--kaiju.migrate.only=true"]
          env:
            - name: KAIJU_ROLE
              value: migrate
            - name: KAIJU_DB_POOL_SIZE
              value: "2"
          envFrom:
            - configMapRef:
                name: kaiju-config
            - secretRef:
                name: kaiju-secrets
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
