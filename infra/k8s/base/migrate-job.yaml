# CON-68: at tier 4, migrations run as a SEPARATE job before deployment, not at
# application startup. Several replicas starting together would otherwise all
# run migrations - that is what differs from the three tiers below.
#
# The pipeline suffixes the job name with the image tag, so each release is a
# new job and the history is preserved.
apiVersion: batch/v1
kind: Job
metadata:
  name: kaiju-migrate
  namespace: kaiju
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kaiju-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: kaiju-backend
          args: ["--kaiju.migrate.only=true"]
          env:
            - name: KAIJU_ROLE
              value: migrate
            - name: KAIJU_DB_POOL_SIZE
              value: "2"
          envFrom:
            - configMapRef:
                name: kaiju-config
            - secretRef:
                name: kaiju-secrets
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
