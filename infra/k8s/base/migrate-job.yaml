# CON-68: migrations run as a SEPARATE job before deployment, never at
# application startup. That holds at every tier; here it is also the only thing
# that stops several replicas starting together from all migrating at once.
#
# The down direction is NOT used at this tier. Rolling back a release means
# redeploying the previous image tag against a schema the old code still
# understands (CON-75).
#
# The pipeline suffixes the job name with the image tag, so each release is a
# new job and the history is preserved.
apiVersion: batch/v1
kind: Job
metadata:
  name: kaiju-migrate
  namespace: kaiju
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kaiju-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: kaiju-backend
          env:
            - name: KAIJU_ROLE
              value: migrate
            - name: KAIJU_MIGRATE_COMMAND
              value: up
            # Directly, never through a pooler: the changelog lock is held for
            # the length of the run and is session-scoped (CON-62).
            - name: KAIJU_DB_URL
              valueFrom:
                secretKeyRef:
                  name: kaiju-secrets
                  key: KAIJU_DB_DIRECT_URL
            - name: KAIJU_DB_POOL_SIZE
              value: "2"
          envFrom:
            - configMapRef:
                name: kaiju-config
            - secretRef:
                name: kaiju-secrets
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
