apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaiju-worker
  namespace: kaiju
  annotations:
    # Deployment order is mandatory (CON-69): migration -> worker and
    # scheduler -> api and realtime. Argo CD enforces it through waves;
    # the migration runs earlier still, as a PreSync hook.
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: kaiju-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kaiju-worker }
    spec:
      # CON-79: without this, both replicas can land on the SAME node. The PDB
      # then refuses every eviction on that node (it must keep one available),
      # which deadlocks `kubectl drain` and stalls any cluster scale-down - while
      # also silently giving up the availability the second replica was for.
      #
      # DoNotSchedule is deliberate: on a one-node cluster the second replica
      # stays Pending, and that Pending pod is exactly the signal the cluster
      # autoscaler needs to add a node.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: kaiju-worker }
      terminationGracePeriodSeconds: 60
      containers:
        - name: app
          image: kaiju-backend
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: KAIJU_ROLE
              value: worker
            - name: KAIJU_DB_POOL_SIZE
              value: "10"
            - name: OTEL_SERVICE_NAME
              value: kaiju-worker
          envFrom:
            - configMapRef: { name: kaiju-config }
            - secretRef: { name: kaiju-secrets }
          # Healthy means the relay process is running AND queue lag is below
          # the threshold. A worker that is alive while the queue is an hour
          # behind is NOT healthy.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 1536Mi }
