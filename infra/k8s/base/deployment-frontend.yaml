# Next is used as an SPA shell (ADR-0008). This process only serves marketing
# pages and the magic-link landing page; the whole app area renders client-side.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaiju-frontend
  namespace: kaiju
  annotations:
    # Deployment order is mandatory (CON-69): migration -> worker and
    # scheduler -> api and realtime. Argo CD enforces it through waves;
    # the migration runs earlier still, as a PreSync hook.
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: kaiju-frontend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kaiju-frontend }
    spec:
      # CON-79: without this, both replicas can land on the SAME node. The PDB
      # then refuses every eviction on that node (it must keep one available),
      # which deadlocks `kubectl drain` and stalls any cluster scale-down - while
      # also silently giving up the availability the second replica was for.
      #
      # DoNotSchedule is deliberate: on a one-node cluster the second replica
      # stays Pending, and that Pending pod is exactly the signal the cluster
      # autoscaler needs to add a node.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: kaiju-frontend }
      containers:
        - name: app
          image: kaiju-frontend
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
