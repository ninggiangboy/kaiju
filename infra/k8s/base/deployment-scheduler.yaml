apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaiju-scheduler
  namespace: kaiju
spec:
  # Two replicas for availability, but only ONE works at a time - a distributed
  # lock decides which. This role does not scale: extra replicas exist so it
  # does not die, not so it runs faster.
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: kaiju-scheduler }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kaiju-scheduler }
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: app
          image: kaiju-backend
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: KAIJU_ROLE
              value: scheduler
            - name: KAIJU_DB_POOL_SIZE
              value: "3"
            - name: OTEL_SERVICE_NAME
              value: kaiju-scheduler
          envFrom:
            - configMapRef: { name: kaiju-config }
            - secretRef: { name: kaiju-secrets }
          # Healthy means holding the lock OR waiting for it - a waiting
          # replica is perfectly healthy.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
