# Non-secret configuration only. Secrets come from the platform's secret
# storage and are attached through `envFrom.secretRef: kaiju-secrets`.
#
# Variable names describe a PROPERTY, not a PLACE (CON-67): nothing here is
# named like KAIJU_IS_PROD, because a branch on the environment name is a
# branch that is never exercised where it actually runs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kaiju-config
  namespace: kaiju
data:
  KAIJU_MAIL_TRANSPORT: "smtp"
  KAIJU_OBJECT_STORAGE_PATH_STYLE: "false"
  # CON-68: nothing migrates at startup. The pre-deploy Job does it.
  KAIJU_MIGRATE_COMMAND: "up"

  # Open standard, no product name (CON-64). Switching collection backends is
  # just changing this address.
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "0.1"
