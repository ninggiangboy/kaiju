# Tier 3 deployment.
#
# This playbook does NOT reimplement the deployment order. It gets to the host,
# puts the right files there, and then runs scripts/deploy-staging.sh, which is
# the single place that order is written down. Copying the sequence into a
# second file is how the two quietly drift apart, and the order is mandatory
# (CON-69), not a convention.
- name: Deploy Kaiju to the staging VPS
  hosts: staging
  become: true
  gather_facts: true

  vars:
    kaiju_root: /opt/kaiju
    kaiju_env_file: /etc/kaiju/staging.env

  tasks:
    - name: Refuse a moving image tag
      # Same check the script makes. Making it here too means the run stops
      # before touching the host rather than halfway through (CON-70).
      ansible.builtin.assert:
        that:
          - kaiju_image is defined
          - kaiju_image | length > 0
          - not (kaiju_image is search(':(latest|main|dev)$'))
        fail_msg: >-
          kaiju_image must be an immutable tag bound to a commit (CON-70),
          got '{{ kaiju_image | default("undefined") }}'

    - name: Require the environment file to already exist
      # Secrets are put on the host out of band, mode 600. This playbook never
      # creates or overwrites it - see infra/README.md.
      ansible.builtin.stat:
        path: "{{ kaiju_env_file }}"
      register: env_file
      failed_when: not env_file.stat.exists

    - name: Ensure the deployment directory exists
      ansible.builtin.file:
        path: "{{ kaiju_root }}"
        state: directory
        mode: "0755"

    - name: Sync the compose files and scripts
      ansible.posix.synchronize:
        src: "{{ item }}"
        dest: "{{ kaiju_root }}/"
        delete: true
        rsync_opts: ["--exclude=.git"]
      loop:
        - ../staging
        - ../scripts
        - ../proxy

    - name: Run the deployment
      # Order lives inside this script: migration -> worker and scheduler ->
      # api and realtime -> post-deployment checks.
      ansible.builtin.command:
        cmd: ./scripts/deploy-staging.sh
        chdir: "{{ kaiju_root }}"
      environment:
        KAIJU_IMAGE: "{{ kaiju_image }}"
        KAIJU_ENV_FILE: "{{ kaiju_env_file }}"
      register: deploy
      changed_when: true

    - name: Show the deployment output
      ansible.builtin.debug:
        var: deploy.stdout_lines
