;; Bậc 2 và CI.
;;
;; Chế độ gộp theo giao dịch là chế độ duy nhất đáng kiểm thử: nó phá vỡ mọi
;; giả định về trạng thái ở phạm vi phiên. Chạy bộ kiểm thử tích hợp qua đây là
;; cách tự động DUY NHẤT bắt được vi phạm CON-62.
;;
;; Ba thứ không bao giờ hoạt động ở chế độ này:
;;   - lắng nghe thông báo   -> dùng KAIJU_DB_LISTEN_URL đi thẳng (CON-25)
;;   - khoá tư vấn mức phiên -> dùng loại gắn với giao dịch
;;   - đặt biến ở mức phiên  -> dùng loại có phạm vi giao dịch

[databases]
kaiju = host=postgres port=5432 dbname=kaiju

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

pool_mode = transaction
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; `SHOW POOLS` và `SHOW STATS` là công cụ chẩn đoán chính ở bậc 2: chúng cho
;; biết bao nhiêu kết nối server đang thật sự được tái dùng.
admin_users = kaiju
stats_users = kaiju

max_client_conn = 200

;; CỐ TÌNH ĐỂ NHỎ. Một bộ gộp rộng rãi gần như không bao giờ tái dùng kết nối
;; server giữa hai client khác nhau, và khi đó trạng thái phiên rò rỉ vẫn "chạy
;; đúng" — vi phạm CON-62 không lộ ra. Nó chỉ lộ khi nhiều client tranh nhau
;; MỘT SỐ ÍT kết nối server. Vì vậy công việc CI chạy qua bộ gộp phải chạy test
;; SONG SONG với pool nhỏ; chạy tuần tự qua bộ gộp gần như không kiểm tra gì.
default_pool_size = 5
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

;; Cảnh báo sớm thay vì chờ tới lúc hết kết nối.
log_connections = 1
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

;; Ở chế độ gộp theo giao dịch, phần lớn tham số phiên không được phép đi qua.
;; Danh sách để trống là chủ ý: bất kỳ tham số nào cần giữ giữa các giao dịch
;; đều là dấu hiệu của một vi phạm CON-62 đang bị che đi.
ignore_startup_parameters = extra_float_digits
