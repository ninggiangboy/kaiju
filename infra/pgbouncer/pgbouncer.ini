;; Tier 2 and CI.
;;
;; Transaction pooling is the only mode worth testing against: it breaks every
;; assumption about session-scoped state. Running the integration suite through
;; it is the ONLY automatic way to catch a CON-62 violation.
;;
;; Three things never work in this mode:
;;   - listening for notifications -> use KAIJU_DB_LISTEN_URL directly (CON-25)
;;   - session-level advisory locks -> use the transaction-scoped kind
;;   - session-level SET            -> use the transaction-scoped form

[databases]
kaiju = host=postgres port=5432 dbname=kaiju

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

pool_mode = transaction
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; `SHOW POOLS` and `SHOW STATS` are the main diagnostic at tier 2: they say how
;; many server connections are actually being reused.
admin_users = kaiju
stats_users = kaiju

max_client_conn = 200

;; DELIBERATELY SMALL. A roomy pool almost never hands a server connection from
;; one client to another, and leaked session state then "works fine" - the
;; CON-62 violation never surfaces. It only surfaces when several clients
;; contend for A FEW server connections. So the pooled CI job must run tests in
;; PARALLEL against a small pool; running it serially checks close to nothing.
default_pool_size = 5
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

;; Warn early instead of waiting until connections run out.
log_connections = 1
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

;; Under transaction pooling most session parameters may not pass through. The
;; empty list is intentional: any parameter that needs to survive between
;; transactions is a CON-62 violation being papered over.
ignore_startup_parameters = extra_float_digits
