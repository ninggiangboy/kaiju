# Tier 2 - dev  (layered on top of tier 1)
#
# Adds everything OPERATIONAL. This is where "will this work once deployed" gets
# answered, separately from "is this correct".
#
#   docker compose -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.dev.yml up -d
#
# Four things only this tier catches:
#   1. session-scoped state violations (CON-62)   -> pgbouncer
#   2. a buffered sync stream, with no error      -> caddy
#   3. a trace broken at an async boundary        -> lgtm
#   4. a role missing config when split out       -> the four app services
#
# Deliberately no `name`: this file EXTENDS tier 1 rather than standing up a
# second environment. A different project name would clone the database and
# Redis, then fight the running tier 1 for ports.

x-app: &app
  build:
    context: ../..
    dockerfile: infra/docker/backend.Dockerfile
  image: kaiju-backend:dev
  depends_on:
    pgbouncer:
      condition: service_healthy
    valkey:
      condition: service_healthy
    mailpit:
      condition: service_healthy
    lgtm:
      condition: service_started
  environment: &app-env
    # --- Database --------------------------------------------------------
    # Ordinary reads and writes go THROUGH the connection pooler.
    KAIJU_DB_URL: jdbc:postgresql://pgbouncer:6432/kaiju
    # CON-25: the notification listener connects DIRECTLY. Under transaction
    # pooling, listening never works through a pooler.
    KAIJU_DB_LISTEN_URL: jdbc:postgresql://postgres:5432/kaiju
    KAIJU_DB_USER: kaiju
    KAIJU_DB_PASSWORD: kaiju
    # --- Supporting infrastructure ---------------------------------------
    KAIJU_REDIS_URL: redis://valkey:6379
    KAIJU_MAIL_TRANSPORT: smtp
    KAIJU_MAIL_HOST: mailpit
    KAIJU_MAIL_PORT: "1025"
    KAIJU_MAIL_FROM: no-reply@kaiju.localhost
    KAIJU_OBJECT_STORAGE_ENDPOINT: http://minio:9000
    KAIJU_OBJECT_STORAGE_BUCKET: kaiju-attachments
    KAIJU_OBJECT_STORAGE_ACCESS_KEY: kaiju
    KAIJU_OBJECT_STORAGE_SECRET_KEY: kaiju-dev-secret
    KAIJU_OBJECT_STORAGE_PATH_STYLE: "true"
    KAIJU_PUBLIC_URL: http://localhost:8080
    # --- Observability: open standard only, no product name (CON-64) -----
    OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
    OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    OTEL_TRACES_SAMPLER: always_on
  restart: unless-stopped

services:
  pgbouncer:
    image: edoburu/pgbouncer:latest
    depends_on:
      postgres:
        condition: service_healthy
    # Configuration comes from the mounted file, not from environment
    # variables: CI uses this exact file, so the two cannot drift apart.
    ports:
      - "6432:6432"
    volumes:
      - ../pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ../pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  lgtm:
    # One container bundling an open-standard collector with metric, log and
    # trace stores and a viewing interface.
    #
    # WARNING: the publisher states this is NOT for production - the data is
    #          not durable and it does not consider scale. It exists only at
    #          tiers 1-2 and in CI.
    #
    # Interface: http://localhost:3001
    image: grafana/otel-lgtm:latest
    ports:
      - "3001:3000"   # 3000 is reserved for Next
      - "4317:4317"   # OTLP/gRPC
      - "4318:4318"   # OTLP/HTTP
    volumes:
      - lgtm-data:/data

  caddy:
    # The reverse proxy. It exists at this tier for exactly one reason: to
    # prove the sync stream is NOT buffered. Getting that wrong produces no
    # error at all - the only symptom is "realtime does not work".
    image: caddy:2-alpine
    depends_on:
      - api
      - realtime
    ports:
      - "8080:8080"
    volumes:
      - ../proxy/Caddyfile.dev:/etc/caddy/Caddyfile:ro

  api:
    <<: *app
    environment:
      <<: *app-env
      KAIJU_ROLE: api
      KAIJU_DB_POOL_SIZE: "20"
      KAIJU_MIGRATE_ON_STARTUP: "true"
      OTEL_SERVICE_NAME: kaiju-api
    expose:
      - "8080"

  realtime:
    <<: *app
    depends_on:
      api:
        condition: service_started
    environment:
      <<: *app-env
      KAIJU_ROLE: realtime
      KAIJU_DB_POOL_SIZE: "5"
      KAIJU_MIGRATE_ON_STARTUP: "false"
      OTEL_SERVICE_NAME: kaiju-realtime
    expose:
      - "8080"

  worker:
    <<: *app
    depends_on:
      api:
        condition: service_started
    environment:
      <<: *app-env
      KAIJU_ROLE: worker
      KAIJU_DB_POOL_SIZE: "10"
      KAIJU_MIGRATE_ON_STARTUP: "false"
      OTEL_SERVICE_NAME: kaiju-worker

  scheduler:
    <<: *app
    depends_on:
      api:
        condition: service_started
    environment:
      <<: *app-env
      KAIJU_ROLE: scheduler
      KAIJU_DB_POOL_SIZE: "3"
      KAIJU_MIGRATE_ON_STARTUP: "false"
      OTEL_SERVICE_NAME: kaiju-scheduler

volumes:
  lgtm-data:
