# Bậc 2 — dev  (chồng lên bậc 1)
#
# Thêm mọi thứ thuộc về VẬN HÀNH. Đây là nơi trả lời câu hỏi "cái này có chạy
# được khi triển khai thật không", tách khỏi câu hỏi "cái này có đúng không".
#
#   docker compose -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.dev.yml up -d
#
# Bốn thứ chỉ bậc này bắt được:
#   1. Vi phạm CON-62 (trạng thái ở phạm vi phiên)      -> pgbouncer
#   2. Luồng đồng bộ bị đệm, không sinh lỗi nào          -> caddy
#   3. Chuỗi lần vết đứt ở ranh giới bất đồng bộ         -> lgtm
#   4. Vai trò ứng dụng thiếu cấu hình khi chạy tách rời -> bốn service app

# KHÔNG đặt lại `name`: tệp này CHỒNG LÊN bậc 1 chứ không dựng một môi trường
# thứ hai. Đặt tên khác sẽ tạo bản sao của cơ sở dữ liệu và Redis, rồi tranh
# cổng với bậc 1 đang chạy.

x-app: &app
  build:
    context: ../..
    dockerfile: infra/docker/backend.Dockerfile
  image: kaiju-backend:dev
  depends_on:
    pgbouncer:
      condition: service_healthy
    valkey:
      condition: service_healthy
    mailpit:
      condition: service_healthy
    lgtm:
      condition: service_started
  environment: &app-env
    # --- Cơ sở dữ liệu ---------------------------------------------------
    # Đường ghi/đọc thường đi QUA bộ gộp kết nối.
    KAIJU_DB_URL: jdbc:postgresql://pgbouncer:6432/kaiju
    # CON-25: kết nối lắng nghe thông báo đi THẲNG tới cơ sở dữ liệu. Ở chế độ
    # gộp theo giao dịch, cơ chế lắng nghe không bao giờ hoạt động qua bộ gộp.
    KAIJU_DB_LISTEN_URL: jdbc:postgresql://postgres:5432/kaiju
    KAIJU_DB_USER: kaiju
    KAIJU_DB_PASSWORD: kaiju
    # --- Hạ tầng phụ trợ -------------------------------------------------
    KAIJU_REDIS_URL: redis://valkey:6379
    KAIJU_MAIL_TRANSPORT: smtp
    KAIJU_MAIL_HOST: mailpit
    KAIJU_MAIL_PORT: "1025"
    KAIJU_MAIL_FROM: no-reply@kaiju.localhost
    KAIJU_OBJECT_STORAGE_ENDPOINT: http://minio:9000
    KAIJU_OBJECT_STORAGE_BUCKET: kaiju-attachments
    KAIJU_OBJECT_STORAGE_ACCESS_KEY: kaiju
    KAIJU_OBJECT_STORAGE_SECRET_KEY: kaiju-dev-secret
    KAIJU_OBJECT_STORAGE_PATH_STYLE: "true"
    KAIJU_PUBLIC_URL: http://localhost:8080
    # --- Quan sát: chỉ chuẩn mở, không tên sản phẩm nào (CON-64) ---------
    OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
    OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    OTEL_TRACES_SAMPLER: always_on
  restart: unless-stopped

services:
  pgbouncer:
    image: edoburu/pgbouncer:latest
    depends_on:
      postgres:
        condition: service_healthy
    # Cấu hình đến từ tệp được gắn vào, không từ biến môi trường: CI dùng đúng
    # tệp này, nên hai nơi không thể lệch nhau.
    ports:
      - "6432:6432"
    volumes:
      - ../pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ../pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  lgtm:
    # Một container gói sẵn bộ thu thập theo chuẩn mở cùng kho chỉ số, kho nhật
    # ký, kho lần vết và giao diện xem.
    #
    # ⚠️ Nhà phát hành nói rõ đây KHÔNG dành cho môi trường thật: dữ liệu không
    #    bền và không tính tới quy mô. Nó chỉ tồn tại ở bậc 1–2 và ở CI.
    #
    # Giao diện: http://localhost:3001
    image: grafana/otel-lgtm:latest
    ports:
      - "3001:3000"   # 3000 để dành cho Next
      - "4317:4317"   # OTLP/gRPC
      - "4318:4318"   # OTLP/HTTP
    volumes:
      - lgtm-data:/data

  caddy:
    # Máy chủ trung gian. Lý do tồn tại ở bậc này chỉ có một: chứng minh luồng
    # đồng bộ KHÔNG bị đệm. Cấu hình sai ở chỗ đó không sinh ra lỗi nào — triệu
    # chứng duy nhất là "realtime không chạy".
    image: caddy:2-alpine
    depends_on:
      - api
      - realtime
    ports:
      - "8080:8080"
    volumes:
      - ../proxy/Caddyfile.dev:/etc/caddy/Caddyfile:ro

  api:
    <<: *app
    environment:
      <<: *app-env
      KAIJU_ROLE: api
      KAIJU_DB_POOL_SIZE: "20"
      KAIJU_MIGRATE_ON_STARTUP: "true"
      OTEL_SERVICE_NAME: kaiju-api
    expose:
      - "8080"

  realtime:
    <<: *app
    depends_on:
      api:
        condition: service_started
    environment:
      <<: *app-env
      KAIJU_ROLE: realtime
      KAIJU_DB_POOL_SIZE: "5"
      KAIJU_MIGRATE_ON_STARTUP: "false"
      OTEL_SERVICE_NAME: kaiju-realtime
    expose:
      - "8080"

  worker:
    <<: *app
    depends_on:
      api:
        condition: service_started
    environment:
      <<: *app-env
      KAIJU_ROLE: worker
      KAIJU_DB_POOL_SIZE: "10"
      KAIJU_MIGRATE_ON_STARTUP: "false"
      OTEL_SERVICE_NAME: kaiju-worker

  scheduler:
    <<: *app
    depends_on:
      api:
        condition: service_started
    environment:
      <<: *app-env
      KAIJU_ROLE: scheduler
      KAIJU_DB_POOL_SIZE: "3"
      KAIJU_MIGRATE_ON_STARTUP: "false"
      OTEL_SERVICE_NAME: kaiju-scheduler

volumes:
  lgtm-data:
