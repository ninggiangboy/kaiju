# Tier 1 - local-mini
#
# Enough for `./gradlew bootRun` to start and for the test suite to run. None of
# the operational machinery lives here: no connection pooler, no observability
# stack, no reverse proxy, no split application roles. All four make debugging
# harder and none of them catch a logic bug - they belong to tier 2.
#
#   docker compose -f infra/compose/docker-compose.yml up -d
#
# Backend and frontend run OUTSIDE Docker at this tier.

name: kaiju

services:
  postgres:
    image: postgres:18-alpine
    command:
      # The architecture depends on session notifications and on row locking
      # that skips locked rows. Both come for free, but the connection budget
      # has to be wide enough for four roles plus the dedicated listener.
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=500
    environment:
      POSTGRES_DB: kaiju
      POSTGRES_USER: kaiju
      POSTGRES_PASSWORD: kaiju
      # Required for authentication through the connection pooler at tier 2.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 moved the recommended mount point: mount at
      # /var/lib/postgresql, NOT /var/lib/postgresql/data. The image refuses to
      # start on the old path. The new one also allows an in-place major upgrade
      # later on.
      - postgres-data:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaiju -d kaiju"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    command:
      # Losing Redis makes the system slower, never wrong (ADR-0003). Running
      # without persistence here keeps the local setup honest about that.
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    # Magic link is the only way to sign in, so without this nobody can log in.
    # Web interface: http://localhost:8025
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web interface
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Only used from phase 4, but present from the start: adding it later costs
    # more than leaving it running.
    # Console: http://localhost:9001
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kaiju
      MINIO_ROOT_PASSWORD: kaiju-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set kaiju http://minio:9000 kaiju kaiju-dev-secret &&
      mc mb --ignore-existing kaiju/kaiju-attachments &&
      echo 'bucket ready'
      "
    restart: "no"

  # The migration runner. It is NEVER started by `up`: it sits behind a compose
  # profile and is invoked one command at a time (see `make db-up`, `db-down`,
  # `db-status`).
  #
  # CON-68: nothing migrates at application startup, at any tier. The schema
  # changes because somebody asked it to.
  #
  # It connects DIRECTLY to the database even at tier 2, where everything else
  # goes through the connection pooler: the migration tool holds a changelog
  # lock for the length of the run, and a session-scoped lock does not survive
  # transaction pooling (CON-62).
  migrate:
    profiles: ["migrate"]
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    image: kaiju-backend:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KAIJU_ROLE: migrate
      # up | down | status. `down` reverts KAIJU_MIGRATE_COUNT changesets.
      KAIJU_MIGRATE_COMMAND: ${KAIJU_MIGRATE_COMMAND:-up}
      KAIJU_MIGRATE_COUNT: ${KAIJU_MIGRATE_COUNT:-1}
      KAIJU_DB_URL: jdbc:postgresql://postgres:5432/kaiju
      KAIJU_DB_USER: kaiju
      KAIJU_DB_PASSWORD: kaiju
      KAIJU_DB_POOL_SIZE: "2"
    restart: "no"

volumes:
  postgres-data:
  minio-data:
