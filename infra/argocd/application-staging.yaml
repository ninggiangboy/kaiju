# NOT tier 3. Tier 3 is compose on a single VPS and is deployed by Ansible.
#
# This Application exists only to run staging on the SAME cluster as production
# when the manifests themselves need exercising - see the note in
# k8s/overlays/staging/kustomization.yaml. It is optional; the real staging does
# not go through Argo CD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kaiju-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: kaiju
  source:
    repoURL: https://github.com/OWNER/kaiju.git
    targetRevision: main
    path: infra/k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: kaiju-staging
  syncPolicy:
    # Automated is correct here BECAUSE the human gate is upstream: the gate is
    # merging the pull request that changes the image tag, not clicking Sync.
    automated:
      prune: true
      # Revert anything changed directly against the cluster. Drift is a bug:
      # git is the only place the desired state is allowed to come from.
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
    retry:
      limit: 3
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }

  # WITHOUT THIS, ARGO CD AND THE AUTOSCALER FIGHT.
  #
  # The manifests declare `replicas`, and the horizontal autoscaler changes that
  # same field at runtime. With selfHeal on, Argo would see the autoscaled value
  # as drift and reset it to the manifest value - undoing every scale-up, within
  # seconds, silently, and only ever under real load.
  #
  # The replica count for an autoscaled role is owned by the autoscaler. The
  # manifest value is only the starting point.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: kaiju-api
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: kaiju-realtime
      jsonPointers: ["/spec/replicas"]
    - group: apps
      kind: Deployment
      name: kaiju-worker
      jsonPointers: ["/spec/replicas"]
