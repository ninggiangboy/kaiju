# Build images and deploy.
#
# ONE backend image for all four roles (CON-66) - the role is chosen at startup.
# Tags are always immutable and bound to a commit (CON-70): deploying from a
# moving tag means not knowing what is running.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy to production (requires approval)
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build images
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: meta
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: true
          # The commit tag is always present. A version tag is added only on a
          # tag push - and there is NO `latest` anywhere, because nothing may
          # deploy from one.
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.tag }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}/backend:{1}', github.repository, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.meta.outputs.tag }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}/frontend:{1}', github.repository, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Merging to the main branch only BUILDS images. Deploying to staging needs a
  # version tag - releasing is a deliberate act, not a side effect of merging.
  staging:
    name: Deploy staging
    needs: images
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - name: Deploy
        # The order inside that script is mandatory (CON-69):
        #   migration -> worker and scheduler -> api and realtime
        # Background processes must understand the new event format BEFORE
        # anything produces it.
        run: |
          echo "Not wired up yet: needs credentials for the staging host."
          echo "The command to run on that host:"
          echo "  KAIJU_IMAGE=ghcr.io/${{ github.repository }}/backend:${{ needs.images.outputs.tag }} \\"
          echo "  infra/scripts/deploy-staging.sh"
          exit 1

  production:
    name: Deploy production
    needs: [images, staging]
    if: inputs.deploy_production
    runs-on: ubuntu-latest
    # This environment carries a manual approval rule. It is the only human
    # gate in the whole pipeline.
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Write the image tag into the manifests
        run: |
          cd infra/k8s/overlays/production
          kubectl kustomize . > /dev/null   # validate before touching anything
          echo "Not wired up yet: needs cluster credentials."
          echo "The steps, in this exact order (CON-68, CON-69):"
          echo "  1. kubectl apply -f <migration job>  and wait for it to finish"
          echo "  2. kubectl set image deploy/kaiju-worker deploy/kaiju-scheduler ..."
          echo "  3. kubectl set image deploy/kaiju-api deploy/kaiju-realtime ..."
          echo "  4. infra/scripts/smoke.sh https://<domain>"
          exit 1
