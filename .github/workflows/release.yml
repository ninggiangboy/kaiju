# Build images and deploy.
#
# ONE backend image for all four roles (CON-66) - the role is chosen at startup.
# Tags are always immutable and bound to a commit (CON-70): deploying from a
# moving tag means not knowing what is running.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build images
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: true
          # The commit tag is always present. A version tag is added only on a
          # tag push - and there is NO `latest` anywhere, because nothing may
          # deploy from one.
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.tag }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}/backend:{1}', github.repository, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.meta.outputs.tag }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}/frontend:{1}', github.repository, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Merging to the main branch only BUILDS images. Deploying to staging needs a
  # version tag - releasing is a deliberate act, not a side effect of merging.
  staging:
    name: Deploy staging
    needs: images
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: pipx install --include-deps ansible-core

      - name: Authorise the deploy key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.STAGING_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy
        # The order (migration -> worker and scheduler -> api and realtime,
        # CON-69) lives inside scripts/deploy-staging.sh, which this playbook
        # calls. It is not restated here, so the two cannot drift.
        working-directory: infra/ansible
        run: |
          cp inventory/hosts.yml.example inventory/hosts.yml
          ansible-playbook deploy-staging.yml \
            -e kaiju_image=ghcr.io/${{ github.repository }}/backend:${{ needs.images.outputs.tag }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: "True"

  # Tier 4 is NOT deployed from here (CON-77). This job proposes the change; a
  # human merging the pull request is what deploys, and Argo CD reconciles from
  # the merged commit. The diff says exactly which tag is replacing which -
  # something an approval button never did.
  propose-production:
    name: Propose production release
    needs: [images, staging]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Pin the image tag in the production overlay
        working-directory: infra/k8s/overlays/production
        run: |
          kustomize edit set image \
            kaiju-backend=ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }} \
            kaiju-frontend=ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}

      - name: Verify the overlay still builds
        run: kubectl kustomize infra/k8s/overlays/production > /dev/null

      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="release/${{ github.ref_name }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add infra/k8s/overlays/production/kustomization.yaml
          git commit -m "release: deploy ${{ github.ref_name }} to production"
          git push origin "$branch"
          gh pr create \
            --base main --head "$branch" \
            --title "release: deploy ${{ github.ref_name }} to production" \
            --body "Merging this deploys \`${{ github.ref_name }}\` to production.

          Argo CD reconciles from the merged commit. The migration runs first as
          a PreSync hook, then worker and scheduler, then api and realtime
          (CON-69). Rolling back is \`git revert\` of the merge.

          Staging is already running this tag."
