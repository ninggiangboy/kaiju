# Build images and deploy.
#
# ONE backend image for all four roles (CON-66) - the role is chosen at startup.
# Tags are always immutable and bound to a commit (CON-70): deploying from a
# moving tag means not knowing what is running.

name: Release

on:
  push:
    branches: [dev, staging]
    tags: ["v*"]
    # Without this, the tag-pinning commit this workflow makes on `dev` would
    # trigger the workflow again, forever.
    paths-ignore:
      - infra/k8s/base/kustomization.yaml
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Neither application has been written yet - the repository is still
  # documentation and infrastructure. Without this guard, `Build images` fails
  # on every single push to `dev`, and a workflow that is permanently red is a
  # workflow whose next failure nobody looks at.
  #
  # Keyed on the build file rather than the directory, and it removes itself the
  # day that file lands - the same rule `Detect changed directories` in ci.yml
  # uses, so the two cannot disagree about when an application exists.
  sources:
    name: Applications present
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          set -euo pipefail
          missing=()
          [[ -f backend/settings.gradle.kts ]] || missing+=("backend/settings.gradle.kts")
          [[ -f frontend/package.json ]]      || missing+=("frontend/package.json")
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::nothing to build or deploy yet - missing ${missing[*]}"
          fi

  images:
    name: Build images
    needs: sources
    if: |
      needs.sources.outputs.present == 'true' &&
      (github.ref_name == 'dev' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: meta
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: true
          # The commit tag is always present. A version tag is added only on a
          # tag push - and there is NO `latest` anywhere, because nothing may
          # deploy from one.
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.tag }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}/backend:{1}', github.repository, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.meta.outputs.tag }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}/frontend:{1}', github.repository, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ONE ENVIRONMENT PER BRANCH (CON-77).
  #
  #   dev ──PR──> staging ──PR──> production
  #
  # The image tag lives in infra/k8s/base/kustomization.yaml, so it travels with
  # the branch. A promotion pull request's diff is exactly the tag change plus
  # whatever code moved with it, which is what makes merging it a reviewable
  # deployment rather than a button press.
  pin-tag:
    name: Pin the new tag on dev
    needs: images
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with: { ref: dev }

      - name: Install kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Pin the image tag
        working-directory: infra/k8s/base
        run: |
          kustomize edit set image \
            kaiju-backend=ghcr.io/${{ github.repository }}/backend:${{ needs.images.outputs.tag }} \
            kaiju-frontend=ghcr.io/${{ github.repository }}/frontend:${{ needs.images.outputs.tag }}

      - name: Verify both overlays still build
        run: |
          kubectl kustomize infra/k8s/overlays/staging > /dev/null
          kubectl kustomize infra/k8s/overlays/production > /dev/null

      - name: Commit it
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/base/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: pin ${{ needs.images.outputs.tag }}"
          git push origin dev

      - name: Open or refresh the promotion pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --base staging --head dev --state open --json number \
            | grep -q '"number"' && exit 0
          gh pr create --base staging --head dev \
            --title "promote: dev -> staging" \
            --body "Merging this deploys to staging: Ansible updates the tier 3 VPS, and Argo CD reconciles the tier 4 staging namespace from this branch."

  # Merging into `staging` IS the staging deployment. Tier 3 is compose on a
  # single VPS, so Argo CD cannot reach it - Ansible does that half, while Argo
  # reconciles the tier 4 staging namespace on its own.
  deploy-staging:
    name: Deploy staging
    needs: sources
    if: needs.sources.outputs.present == 'true' && github.ref_name == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Ansible
        run: pipx install --include-deps ansible-core

      - name: Authorise the deploy key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.STAGING_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Read the tag this branch carries
        id: tag
        run: |
          t=$(grep -A2 'name: kaiju-backend' infra/k8s/base/kustomization.yaml \
              | grep newTag | awk '{print $2}')
          echo "image=ghcr.io/${{ github.repository }}/backend:$t" >> "$GITHUB_OUTPUT"

      - name: Deploy
        # The order (migration -> worker and scheduler -> api and realtime,
        # CON-69) lives inside scripts/deploy-staging.sh, which this playbook
        # calls. It is not restated here, so the two cannot drift.
        working-directory: infra/ansible
        run: |
          cp inventory/hosts.yml.example inventory/hosts.yml
          ansible-playbook deploy-staging.yml -e kaiju_image=${{ steps.tag.outputs.image }}

      - name: Open the production promotion pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --base production --head staging --state open --json number \
            | grep -q '"number"' && exit 0
          gh pr create --base production --head staging \
            --title "promote: staging -> production" \
            --body "Merging this deploys to production. Argo CD reconciles the \`production\` branch: the migration runs first as a PreSync hook, then worker and scheduler, then api and realtime (CON-69). Rolling back is \`git revert\` of the merge.

          This tag is already running on staging."

  # THERE IS NO PRODUCTION JOB, and that is the point (CON-78). Merging the
  # pull request into `production` is the deployment; Argo CD reconciles from
  # that branch. Nothing here ever issues a command against the cluster.
