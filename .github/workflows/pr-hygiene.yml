# Commit messages are written in English, following Conventional Commits, even
# though the documentation itself is in Vietnamese (CON-50).

name: PR hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: Pull request title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the Conventional Commits form
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|refactor|test|chore|perf|build|ci|infra)(\([a-z0-9-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "FAIL: title is not in the expected form: $TITLE"
            echo "  Example: docs: add the phased roadmap"
            exit 1
          fi
          # English only: catch Vietnamese accented characters.
          if LC_ALL=C grep -qP '[\x{00C0}-\x{1EF9}]' <<<"$TITLE"; then
            echo "FAIL: the title must be written in English (CON-50): $TITLE"
            exit 1
          fi
          echo "PASS: $TITLE"
