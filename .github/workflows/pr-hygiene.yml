# Commit messages are written in English, following Conventional Commits, even
# though the documentation itself is in Vietnamese (CON-50).

name: PR hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: Pull request title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the Conventional Commits form
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|refactor|test|chore|perf|build|ci|infra)(\([a-z0-9-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "FAIL: title is not in the expected form: $TITLE"
            echo "  Example: docs: add the phased roadmap"
            exit 1
          fi
          # English only: catch Vietnamese accented characters.
          if LC_ALL=C grep -qP '[\x{00C0}-\x{1EF9}]' <<<"$TITLE"; then
            echo "FAIL: the title must be written in English (CON-50): $TITLE"
            exit 1
          fi
          echo "PASS: $TITLE"

  # Environments are promoted in order (ADR-0015): dev -> staging -> production.
  #
  # This lives here rather than in branch protection because GitHub can require
  # that a branch only take pull requests - it cannot say WHICH branch those may
  # come from. Without this check, a pull request straight from `dev` into
  # `production` is accepted and skips tier 3 entirely.
  promotion:
    name: Promotion order
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          case "$BASE" in
            production) expected=staging ;;
            staging)    expected=dev ;;
            *)          echo "PASS: $BASE is not an environment branch"; exit 0 ;;
          esac
          # A rollback is the one exemption (ADR-0016). It carries no new code -
          # it puts the environment back in the state it was just running, so
          # the reason this check exists does not apply to it. Making a rollback
          # travel dev -> staging -> production would add two CI runs and a tier
          # 3 deploy to the length of an incident.
          #
          # This covers revert only. An urgent FIX is new code, and new code has
          # no exemption.
          if [[ "$HEAD" == rollback/* ]]; then
            echo "PASS: $HEAD is a rollback (ADR-0016)"
            echo "  Remember step 4: bring the revert back to dev, or the next"
            echo "  promotion will not restore these commits."
            exit 0
          fi
          if [[ "$HEAD" != "$expected" ]]; then
            echo "FAIL: $BASE only accepts pull requests from '$expected', got '$HEAD'"
            echo "  Environments are promoted in order: dev -> staging -> production."
            echo "  A fix for production goes to dev first, then through staging."
            exit 1
          fi
          echo "PASS: $HEAD -> $BASE"

  # Branch naming (ADR-0016). The prefix set is the same one the title check
  # uses, so a branch name and its pull request title always agree on the type.
  #
  # NOTE: this job cannot be a required check. `dev` takes a direct push from
  # the release pipeline (the image-tag pin commit), and required status checks
  # block direct pushes too - so requiring this would break the pipeline. It
  # shows up red on the pull request and is not enforced beyond that.
  branch:
    name: Branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check the branch name
        env:
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          case "$HEAD" in
            dev|staging|production)
              echo "PASS: $HEAD is an environment branch (promotion)"; exit 0 ;;
            dependabot/*|claude/*)
              echo "PASS: $HEAD is generated, not hand-named"; exit 0 ;;
          esac
          pattern='^(feat|fix|docs|refactor|test|chore|perf|build|ci|infra|rollback)/[a-z0-9._-]+$'
          if [[ ! "$HEAD" =~ $pattern ]]; then
            echo "FAIL: branch name is not in the expected form: $HEAD"
            echo "  Expected <type>/<slug>, for example feat/kj-sync-07-catch-up-cursor"
            exit 1
          fi
          echo "PASS: $HEAD"
