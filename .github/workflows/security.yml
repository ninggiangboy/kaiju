# Runs on a schedule, and again whenever a dependency manifest changes.
#
# Kept out of the main pipeline because it must not block merges: a newly
# disclosed vulnerability in a library is not the fault of whichever pull
# request happens to be open.

name: Security

on:
  schedule:
    - cron: "0 3 * * 1"
  push:
    paths:
      - "backend/**/*.gradle*"
      - "backend/gradle/**"
      - "frontend/package-lock.json"
      - "infra/docker/**"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secrets in history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # Scan the WHOLE history, not just new changes: a secret that was ever
        # pushed is compromised, even if a later commit removed it.
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v4
        with: { sarif_file: trivy.sarif }

  code:
    name: Static analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - name: Is there any source for this language
        id: present
        run: |
          case "${{ matrix.language }}" in
            java-kotlin)            [[ -d backend  ]] && echo "yes=true" >> "$GITHUB_OUTPUT" ;;
            javascript-typescript)  [[ -d frontend ]] && echo "yes=true" >> "$GITHUB_OUTPUT" ;;
          esac
          true
      - if: steps.present.outputs.yes == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - if: steps.present.outputs.yes == 'true'
        uses: github/codeql-action/autobuild@v4
      - if: steps.present.outputs.yes == 'true'
        uses: github/codeql-action/analyze@v4
