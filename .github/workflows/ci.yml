# The main pipeline. Runs on every pull request and every push to a main branch.
#
# Two rules govern this whole file:
#
#   1. Only run what is relevant. Editing documentation must not trigger the
#      integration suite. This is the known cost of keeping everything in one
#      repository.
#   2. A SKIPPED job does not count as success (CON-71). This is the trap in
#      every path-filtered pipeline: combined with a filter that is wrong, it is
#      how a backend change merges without a single test having run.
#
# Every script invoked here runs from a developer machine with one command
# (CON-72).

name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "26"
  NODE_VERSION: "22"

jobs:
  # --------------------------------------------------------------------
  changes:
    name: Detect changed directories
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'CLAUDE.md'
              - '.github/scripts/check-docs.py'
            backend:
              - 'backend/**'
              - 'infra/docker/backend.Dockerfile'
            frontend:
              - 'frontend/**'
              - 'infra/docker/frontend.Dockerfile'
            infra:
              - 'infra/**'
              - '.github/workflows/**'

  # --------------------------------------------------------------------
  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Internal links and heading anchors, no duplicate feature identifiers,
      # every dependency pointing at a real one, and no DDL anywhere under
      # docs/ - the data model analysis is deferred, so DDL in the
      # documentation means someone decided something without recording it.
      - run: python3 .github/scripts/check-docs.py

  # --------------------------------------------------------------------
  backend-build:
    name: Backend - compile
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assemble
        working-directory: backend

  backend-unit:
    name: Backend - unit tests
    needs: [changes, backend-build]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
        working-directory: backend

  backend-boundaries:
    name: Backend - module boundaries and forbidden libraries
    needs: [changes, backend-build]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      # Three different checks, and only the first is handled by the tool:
      #   - a module reaching into another module's internals
      #   - querying another module's tables -> NOT caught by the tool (CON-55)
      #   - a forbidden library on the classpath -> a second outbox (CON-56)
      - run: ./gradlew moduleBoundaryTest tablePrefixTest classpathGuardTest
        working-directory: backend

  backend-integration:
    name: Backend - integration tests
    needs: [changes, backend-build]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      # Runs against a real database in a container: row level security,
      # partitioning, row locking and notifications cannot be faked.
      - run: ./gradlew integrationTest
        working-directory: backend

  backend-pooled:
    name: Backend - integration tests through the connection pooler
    needs: [changes, backend-integration]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # The same test suite over a different path to the database. It checks no
    # extra business logic - it checks that the code does not rely on
    # session-scoped state (CON-62) and that the listener connection is routed
    # separately (CON-25).
    #
    # This is KJ-PLT-23, the ONLY automatic way to catch either violation.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kaiju
          POSTGRES_USER: kaiju
          POSTGRES_PASSWORD: kaiju
        options: >-
          --health-cmd "pg_isready -U kaiju" --health-interval 5s
          --health-timeout 3s --health-retries 20
        ports: ["5432:5432"]
      pgbouncer:
        image: edoburu/pgbouncer:latest
        env:
          DB_HOST: postgres
          DB_PORT: "5432"
          DB_USER: kaiju
          DB_PASSWORD: kaiju
          POOL_MODE: transaction
          AUTH_TYPE: scram-sha-256
          # DELIBERATELY SMALL. A roomy pool hands the same server connection
          # back to the same client, so leaked session state survives and the
          # tests stay green. The violation only surfaces when several clients
          # contend for a few server connections.
          DEFAULT_POOL_SIZE: "5"
          MAX_CLIENT_CONN: "100"
        ports: ["6432:6432"]
    env:
      # Ordinary reads and writes go THROUGH the pooler...
      KAIJU_DB_URL: jdbc:postgresql://localhost:6432/kaiju
      # ...while the listener connects DIRECTLY. Under transaction pooling,
      # listening never works through a pooler.
      KAIJU_DB_DIRECT_URL: jdbc:postgresql://localhost:5432/kaiju
      KAIJU_DB_USER: kaiju
      KAIJU_DB_PASSWORD: kaiju
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      # Parallelism is mandatory here, not an optimisation: running serially
      # through the pooler checks close to nothing.
      - run: ./gradlew integrationTest -Dkaiju.test.externalDatabase=true --max-workers=4
        working-directory: backend

  backend-migration:
    name: Backend - migrations up, down and backward-compatible
    needs: [changes, backend-build]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      # Run the NEW migrations against a database the OLD application version
      # is using, then run the old version's tests. This catches a breaking
      # change during the window where two versions run side by side - which is
      # exactly what makes a rollback safe.
      - run: ./gradlew migrationCompatibilityTest
        working-directory: backend
      # Every changeset must carry a hand-written rollback (CON-74), and the
      # rollback must actually run: up, then all the way down, then up again,
      # ending on the same schema. A rollback that has never been executed is
      # a rollback that does not exist - it is only ever needed at the worst
      # possible moment.
      - run: ./gradlew migrationRollbackTest
        working-directory: backend

  # --------------------------------------------------------------------
  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      # Includes the project's OWN rules: no Server Actions for business
      # mutations and no business data fetching in server components (CON-35,
      # CON-36). Without them both are just sentences in a document.
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # Some errors only appear in a production build.
      - run: npm run build
        working-directory: frontend

  # --------------------------------------------------------------------
  infra:
    name: Infrastructure
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cheap, and it catches the kind of typo that otherwise surfaces at
      # deployment time.
      - run: make check-compose
        working-directory: infra
      - run: make check-k8s
        working-directory: infra
      - name: Reverse proxy configuration
        # Both files, because the staging one is where the sync stream first
        # travels over real TLS - and it is also the file nobody opens.
        run: |
          docker run --rm -e KAIJU_DOMAIN=example.com -v "$PWD/proxy:/w" -w /w caddy:2-alpine \
            sh -c 'caddy validate --config Caddyfile.dev --adapter caddyfile &&
                   caddy validate --config Caddyfile.staging --adapter caddyfile'
        working-directory: infra
      - name: Operational scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck infra/scripts/*.sh
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - run: make check-tofu
        working-directory: infra
      - name: Ansible playbooks
        run: |
          pipx install --include-deps ansible-core
          make check-ansible
        working-directory: infra
      - name: Argo CD manifests
        # A malformed Application does not fail anything at apply time - it just
        # never syncs, quietly.
        run: |
          for f in infra/argocd/*.yaml; do
            python3 -c "import sys,yaml; yaml.safe_load(open(sys.argv[1]))" "$f"
          done

  # --------------------------------------------------------------------
  gate:
    name: Gate
    needs:
      - changes
      - docs
      - backend-build
      - backend-unit
      - backend-boundaries
      - backend-integration
      - backend-pooled
      - backend-migration
      - frontend
      - infra
    if: always()
    runs-on: ubuntu-latest
    steps:
      # This is the ONLY required check declared in branch protection. Adding a
      # new job to the pipeline does not mean editing that configuration.
      #
      # The rule: any job that should have run for the directories that changed,
      # and ended in a state other than `success`, BLOCKS. A skipped state is
      # acceptable only when the matching directory did not change (CON-71).
      - name: Evaluate results
        env:
          CHANGED_DOCS: ${{ needs.changes.outputs.docs }}
          CHANGED_BACKEND: ${{ needs.changes.outputs.backend }}
          CHANGED_FRONTEND: ${{ needs.changes.outputs.frontend }}
          CHANGED_INFRA: ${{ needs.changes.outputs.infra }}
        run: |
          set -euo pipefail
          fail=0

          verdict() {   # <name> <did its directory change> <result>
            local name="$1" changed="$2" result="$3"
            if [[ "$changed" != "true" ]]; then
              if [[ "$result" == "skipped" ]]; then
                echo "  SKIP $name: directory unchanged"
              else
                echo "  FAIL $name: ran although its directory was unchanged ($result) - the filter is wrong"
                fail=1
              fi
            elif [[ "$result" == "success" ]]; then
              echo "  PASS $name"
            else
              echo "  FAIL $name: $result"
              fail=1
            fi
          }

          echo "Changed: docs=$CHANGED_DOCS backend=$CHANGED_BACKEND frontend=$CHANGED_FRONTEND infra=$CHANGED_INFRA"
          echo

          verdict "Documentation"           "$CHANGED_DOCS"     "${{ needs.docs.result }}"
          verdict "Backend - compile"       "$CHANGED_BACKEND"  "${{ needs['backend-build'].result }}"
          verdict "Backend - unit"          "$CHANGED_BACKEND"  "${{ needs['backend-unit'].result }}"
          verdict "Backend - boundaries"    "$CHANGED_BACKEND"  "${{ needs['backend-boundaries'].result }}"
          verdict "Backend - integration"   "$CHANGED_BACKEND"  "${{ needs['backend-integration'].result }}"
          verdict "Backend - pooled"        "$CHANGED_BACKEND"  "${{ needs['backend-pooled'].result }}"
          verdict "Backend - migration"     "$CHANGED_BACKEND"  "${{ needs['backend-migration'].result }}"
          verdict "Frontend"                "$CHANGED_FRONTEND" "${{ needs.frontend.result }}"
          verdict "Infrastructure"          "$CHANGED_INFRA"    "${{ needs.infra.result }}"

          echo
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "FAIL: could not detect changed directories - no basis to pass"
            exit 1
          fi
          [[ $fail -eq 0 ]] && { echo "Gate open"; exit 0; }
          echo "Gate blocked"
          exit 1
