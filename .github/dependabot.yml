# Grouped, weekly. One pull request per minor library bump is the fastest way to
# make sure nobody reads any of them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: gradle
    directory: /backend
    schedule: { interval: weekly }
    groups:
      backend: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /infra/docker
    schedule: { interval: weekly }
